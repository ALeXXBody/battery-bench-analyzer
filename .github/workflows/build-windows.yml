name: Build Windows EXE + Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build onedir EXE (with icon)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name VoltClinic --icon assets/icon.ico `
            --add-data "assets/icon.ico;voltclinic" run.py

      - name: Headless selftest (offscreen)
        shell: pwsh
        env:
          BATTERYCLINIC_SELFTEST: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          $job = Start-Process -FilePath "dist\VoltClinic\VoltClinic.exe" -PassThru
          Wait-Process -Id $job.Id -Timeout 60 -ErrorAction SilentlyContinue
          if (Test-Path selftest_ok.txt) {
            Get-Content selftest_ok.txt
          } else {
            Write-Error "selftest_ok.txt not written - app failed to start"
            exit 1
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "0.2.0"
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $version = $Matches[1] }
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\VoltClinic.iss
          } else {
            choco install innosetup -y
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\VoltClinic.iss
          }
          echo "Installer version: $version"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoltClinic-windows
          path: |
            dist/VoltClinic/
            dist/VoltClinic-*-setup.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoltClinic-*-setup.exe