[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchanalyzer"
version = "1.0.0"
description = "Bench test, repair and calibrate laptop battery packs (Windows, Linux, macOS)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
benchanalyzer = "benchanalyzer.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["benchanalyzer*"]
